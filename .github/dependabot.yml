version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tehran
    groups:
      composer-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Tehran
    groups:
      npm-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Tehran
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 3
