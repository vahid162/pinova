name: Carbon constructor semantic parity

on:
  push:
    branches: ['proof/carbon-constructor-parity']

permissions:
  contents: read

concurrency:
  group: carbon-constructor-parity-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  parity:
    name: Semantic parity / PHP ${{ matrix.php }}
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    env:
      PINOVA_PARITY_PHP: ${{ matrix.php }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact proof parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = '117e434bf65f093ad9d05f15cd180d34b4193ba9'
          test "${GITHUB_REF}" = 'refs/heads/proof/carbon-constructor-parity'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - name: Run one isolated semantic pair
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          python3 tests/compat/carbon-constructor-parity/run_hosted.py \
            > "${RUNNER_TEMP}/carbon-parity-controller.stdout" \
            2> "${RUNNER_TEMP}/carbon-parity-controller.stderr"
          status=$?
          if test -s "${RUNNER_TEMP}/carbon-parity-controller.stderr"; then
            status=1
          fi
          mkdir -p parity-results
          printf '{"schema":"pinova.carbon-parity-launch.v1","exit_code":%s,"shipping_fix":false}\n' \
            "${status}" > parity-results/launch.json
          if ! test -f parity-results/controller.json; then
            printf '%s\n' '{"state":"failed","phase":"controller_unverified","shipping_fix":false}' \
              > parity-results/controller.json
          fi
          printf 'Semantic controller exit: %s\n' "${status}"
          exit "${status}"
      - name: Upload finite synthetic results only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbon-semantic-parity-php-${{ matrix.php }}
          path: |
            parity-results/controller.json
            parity-results/launch.json
            parity-results/source-check.json
            parity-results/baseline.json
            parity-results/candidate.json
            parity-results/comparison.json
          if-no-files-found: error
          retention-days: 7
