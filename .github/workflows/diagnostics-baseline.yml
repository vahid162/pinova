name: Diagnostics RC21 baseline

on:
  push:
    branches: [feat/diagnostics-upgrade]
    paths:
      - .github/workflows/diagnostics-baseline.yml
      - tests/Integration/diagnostics-baseline.mjs
      - tests/fixtures/fpm-otp/full-stack-site.php
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: RC21 FPM baseline / ${{ matrix.logging }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        logging: [normal, diagnostic]
    env:
      PINOVA_TEST_PROFILE: third-party
      PINOVA_TEST_PLUGIN_SET: deployed
      PINOVA_FPM_LOGGING_PROFILE: ${{ matrix.logging }}
      PINOVA_FPM_FULL_STACK_ROOT: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}
      PINOVA_FPM_BIN: /usr/sbin/php-fpm8.3
      PINOVA_FPM_NGINX_BIN: /usr/sbin/nginx
      PINOVA_FPM_MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      PINOVA_FPM_MYSQL_DEFAULTS_FILE: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}/mysql-admin.cnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3, wp-cli:2.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Require unchanged RC21 runtime and validate evidence guards
        run: |
          node --check tests/Integration/diagnostics-baseline.mjs
          node tests/Integration/diagnostics-baseline.mjs --self-test
          node tests/Integration/diagnostics-baseline.mjs --verify-source
          php -l tests/fixtures/fpm-otp/full-stack-site.php
      - name: Provision disposable native FPM and database
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php8.3-fpm php8.3-curl php8.3-gd php8.3-mbstring php8.3-mysql php8.3-xml php8.3-zip nginx
          sudo systemctl start mysql.service
          mkdir -p "${PINOVA_FPM_FULL_STACK_ROOT}"
          sudo install -m 0600 /dev/null "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}"
          printf '[client]\nuser=root\npassword=root\n' | sudo tee "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" > /dev/null
          echo "PINOVA_FPM_WP_CLI=$(command -v wp)" >> "${GITHUB_ENV}"
      - name: Prepare verified representative profile before network isolation
        run: |
          node --check tests/Integration/otp-fpm-full-stack.mjs
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts
          node tools/prepare-third-party-fixtures.mjs
          wp_version="$(node -p "require('./tests/fixtures/third-party-baseline.json').wordpress")"
          curl --fail --silent --show-error --location --max-time 90 "https://wordpress.org/wordpress-${wp_version}.tar.gz" | tar -xz -C "${PINOVA_FPM_FULL_STACK_ROOT}"
          wp core verify-checksums --path="${PINOVA_FPM_FULL_STACK_ROOT}/wordpress" --version="${wp_version}" --allow-root
      - name: Characterize unchanged RC21 with all existing OFF and ON gates
        run: |
          sudo env GITHUB_ACTIONS="${GITHUB_ACTIONS}" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" PATH="${PATH}" \
            PINOVA_FPM_LOGGING_PROFILE="${PINOVA_FPM_LOGGING_PROFILE}" \
            PINOVA_FPM_FULL_STACK_ROOT="${PINOVA_FPM_FULL_STACK_ROOT}" \
            PINOVA_FPM_BIN="${PINOVA_FPM_BIN}" PINOVA_FPM_NGINX_BIN="${PINOVA_FPM_NGINX_BIN}" \
            PINOVA_FPM_WP_CLI="${PINOVA_FPM_WP_CLI}" PINOVA_FPM_MYSQL_SOCKET="${PINOVA_FPM_MYSQL_SOCKET}" \
            PINOVA_FPM_MYSQL_DEFAULTS_FILE="${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" \
            bash tests/Integration/otp-fpm-full-stack.sh
      - name: Validate and retain finite baseline evidence
        run: |
          sudo env GITHUB_ACTIONS="${GITHUB_ACTIONS}" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            PATH="${PATH}" PINOVA_FPM_LOGGING_PROFILE="${PINOVA_FPM_LOGGING_PROFILE}" \
            PINOVA_FPM_FULL_STACK_ROOT="${PINOVA_FPM_FULL_STACK_ROOT}" \
            node tests/Integration/diagnostics-baseline.mjs
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-rc21-${{ matrix.logging }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PINOVA_FPM_FULL_STACK_ROOT }}/receipt
          if-no-files-found: error
          retention-days: 7
