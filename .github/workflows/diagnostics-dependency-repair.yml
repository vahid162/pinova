name: Diagnostics dependency patch resolution

# Temporary source-resolution job; remove after reviewing and applying its lockfile.
on:
  push:
    branches: [feat/diagnostics-upgrade]
    paths: [.github/workflows/diagnostics-dependency-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/feat/diagnostics-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COMPOSER_MEMORY_LIMIT: 256M
      COMPOSER_PROCESS_TIMEOUT: 180
      COMPOSER_NO_INTERACTION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - name: Require the isolated pinned resolver
        run: |
          test "${GITHUB_ACTIONS}" = true
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "${GITHUB_REF}" = refs/heads/feat/diagnostics-upgrade
          composer --version --no-ansi | head -n 1 | grep -Eq '^Composer version 2\.10\.3( |$)'
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 1 ? 0 : 1);'
      - name: Resolve only the two official security patches without installation
        run: |
          timeout 180s composer update \
            'phpoffice/phpspreadsheet:3.10.8' 'symfony/mime:5.4.55' \
            --minimal-changes --no-install --no-scripts --no-plugins \
            --no-interaction --no-progress --prefer-dist
      - name: Validate and audit the resolved lockfile
        run: |
          composer validate --strict --check-lock
          composer audit --locked --no-dev
      - name: Require an exact two-package change and retain finite evidence
        env:
          PINOVA_PATCH_RECEIPT_DIR: ${{ runner.temp }}/diagnostics-dependency-repair
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          before_bytes = subprocess.check_output(["git", "show", "HEAD:composer.lock"])
          after_bytes = Path("composer.lock").read_bytes()
          before = json.loads(before_bytes)
          after = json.loads(after_bytes)
          require({k: v for k, v in before.items() if k != "packages"} ==
                  {k: v for k, v in after.items() if k != "packages"},
                  "Lock metadata, root hash or development packages changed.")
          before_packages = {p["name"]: p for p in before["packages"]}
          after_packages = {p["name"]: p for p in after["packages"]}
          require(len(before_packages) == len(before["packages"]) and
                  len(after_packages) == len(after["packages"]) and
                  before_packages.keys() == after_packages.keys(),
                  "Package addition, removal or duplication is outside this patch.")
          targets = {
              "phpoffice/phpspreadsheet": ("3.10.7", "3.10.8", "PHPOffice/PhpSpreadsheet"),
              "symfony/mime": ("v5.4.52", "v5.4.55", "symfony/mime"),
          }
          changed = sorted(name for name in before_packages
                           if before_packages[name] != after_packages[name])
          require(changed == sorted(targets), "Unrelated package changes are not allowed.")
          changes = []
          for name, (old_version, new_version, repository) in targets.items():
              old, new = before_packages[name], after_packages[name]
              require(old["version"] == old_version and new["version"] == new_version,
                      "The resolver did not select the exact approved patch versions.")
              reference = new.get("source", {}).get("reference", "")
              require(re.fullmatch(r"[a-f0-9]{40}", reference) is not None and
                      new["source"]["type"] == "git" and
                      new["source"]["url"] == f"https://github.com/{repository}.git" and
                      new["dist"]["type"] == "zip" and new["dist"]["reference"] == reference and
                      new["dist"]["url"] == f"https://api.github.com/repos/{repository}/zipball/{reference}",
                      "A patch no longer resolves to the official upstream source.")
              changes.append({"package": name, "from": old_version, "to": new_version,
                              "source_reference": reference})
          require(subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
                  == ["composer.lock"], "A tracked file outside composer.lock changed.")
          source = os.environ.get("GITHUB_SHA", "")
          require(re.fullmatch(r"[a-f0-9]{40}", source) is not None, "Missing source revision.")
          receipt = {"schema": "pinova.dependency-patch-resolution.v1", "state": "passed",
                     "source_commit": source, "composer_version": "2.10.3", "php_minor": "8.1",
                     "production_audit": "passed", "package_changes": changes,
                     "root_constraints_and_development_packages_unchanged": True,
                     "before_sha256": hashlib.sha256(before_bytes).hexdigest(),
                     "after_sha256": hashlib.sha256(after_bytes).hexdigest(),
                     "installation_performed": False}
          encoded = json.dumps(receipt, indent=2) + "\n"
          require(len(encoded.encode()) <= 4096, "Patch receipt exceeds its finite bound.")
          destination = Path(os.environ["PINOVA_PATCH_RECEIPT_DIR"])
          destination.mkdir()
          shutil.copyfile("composer.lock", destination / "composer.lock")
          (destination / "resolution.json").write_text(encoded)
          print("Validated exactly two official patch updates; production audit passed.")
          PY
      - name: Retain the validated lockfile and receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-dependency-patches-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/diagnostics-dependency-repair/composer.lock
            ${{ runner.temp }}/diagnostics-dependency-repair/resolution.json
          if-no-files-found: error
          retention-days: 7
