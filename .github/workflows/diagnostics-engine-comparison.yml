name: PHP 8.4 CE-cache engine comparison

on:
  push:
    branches: ['proof/php84-ce-cache-20261101']

permissions:
  contents: read

concurrency:
  group: engine-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Six fresh warmups / ABBAAB / no resource acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        logging: ['diagnostic']
    env:
      PINOVA_ENGINE_ROOT: /tmp/pinova-engine-${{ github.run_id }}-${{ github.run_attempt }}
      DEB_BUILD_OPTIONS: parallel=2
      SOURCE_DATE_EPOCH: '1792593321'
      TZ: UTC
      PINOVA_FPM_ENGINE_COMPARE: '1'
      PINOVA_FPM_PROBE_CASE: engine-comparison
      PINOVA_TEST_PROFILE: third-party
      PINOVA_TEST_PLUGIN_SET: deployed
      PINOVA_FPM_FULL_STACK_ROOT: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}
      PINOVA_FPM_CAMPAIGN_ROOT: /tmp/pinova-fpm-revisions-${{ github.run_id }}-${{ github.run_attempt }}
      PINOVA_FPM_BIN: /usr/sbin/php-fpm${{ matrix.php }}
      PINOVA_FPM_PHP_BIN: /usr/bin/php${{ matrix.php }}
      PINOVA_FPM_PHP_VERSION: ${{ matrix.php }}
      PINOVA_FPM_LOGGING_PROFILE: ${{ matrix.logging }}
      PINOVA_FPM_NGINX_BIN: /usr/sbin/nginx
      PINOVA_FPM_MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      PINOVA_FPM_MYSQL_DEFAULTS_FILE: /tmp/pinova-fpm-revisions-${{ github.run_id }}-${{ github.run_attempt }}/mysql-admin.cnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3, wp-cli:2.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Check pure controls before native provisioning
        run: |
          ulimit -c 0
          python3 -I -B tests/Integration/engine-comparison-structural.py
          python3 -I -B tests/Integration/engine-comparison-prepare-test.py
          node --check tests/Integration/otp-fpm-revision-campaign.mjs
          node --check tests/Integration/otp-fpm-full-stack.mjs
          node --check tests/Integration/fpm-settings-observation.mjs
          node --test tests/js/fpm-settings-observation.test.mjs
          php -l tests/fixtures/fpm-otp/full-stack-mu.php
      - name: Validate workflow syntax before native provisioning
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Provision disposable native tools
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "php${PINOVA_FPM_PHP_VERSION}-fpm" "php${PINOVA_FPM_PHP_VERSION}-curl" "php${PINOVA_FPM_PHP_VERSION}-gd" "php${PINOVA_FPM_PHP_VERSION}-mbstring" "php${PINOVA_FPM_PHP_VERSION}-mysql" "php${PINOVA_FPM_PHP_VERSION}-xml" "php${PINOVA_FPM_PHP_VERSION}-zip" nginx
          sudo systemctl start mysql.service
          sudo install -d -m 0755 "${PINOVA_FPM_CAMPAIGN_ROOT}"
          sudo install -m 0600 /dev/null "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}"
          printf '[client]\nuser=root\npassword=root\n' | sudo tee "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" > /dev/null
          echo "PINOVA_FPM_WP_CLI=$(command -v wp)" >> "${GITHUB_ENV}"
      - name: Verify and prepare both exact PPA source trees
        run: |
          ulimit -c 0
          python3 -I -B tests/Integration/engine-comparison-prepare.py sources
      - name: Resolve the exact source descriptor's build dependencies once
        timeout-minutes: 10
        run: |
          ulimit -c 0
          build_dependencies="$(cat "${PINOVA_ENGINE_ROOT}/build-depends.txt")"
          sudo apt-get --no-remove --no-install-recommends --yes install build-essential
          sudo apt-get --no-remove --no-install-recommends --yes satisfy "${build_dependencies}"
          cd "${PINOVA_ENGINE_ROOT}/source-A"
          dpkg-checkbuilddeps
      - name: Build paired core SAPIs and OPcache without package installation
        timeout-minutes: 61
        run: |
          ulimit -c 0
          python3 -I -B tests/Integration/engine-comparison-prepare.py build
      - name: Freeze shared INI and extension bytes; verify both engines
        run: |
          ulimit -c 0
          python3 -I -B tests/Integration/engine-comparison-prepare.py ini
          python3 -I -B tests/Integration/engine-comparison-prepare.py verify
      - name: Prepare one normalized dependency inventory and verified profile
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm ci --ignore-scripts
          node tools/prepare-third-party-fixtures.mjs
          wp_version="$(node -p "require('./tests/fixtures/third-party-baseline.json').wordpress")"
          curl --fail --silent --show-error --location --max-time 90 "https://wordpress.org/wordpress-${wp_version}.tar.gz" \
            | sudo tar -xz -C "${PINOVA_FPM_CAMPAIGN_ROOT}"
          sudo "${PINOVA_FPM_PHP_BIN}" "${PINOVA_FPM_WP_CLI}" core verify-checksums --path="${PINOVA_FPM_CAMPAIGN_ROOT}/wordpress" --version="${wp_version}" --allow-root
      - name: Run each predeclared engine variant once; warmup diagnosis only
        run: |
          ulimit -c 0
          sudo env PINOVA_ENGINE_ROOT="${PINOVA_ENGINE_ROOT}" GITHUB_ACTIONS="${GITHUB_ACTIONS}" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" GITHUB_SHA="${GITHUB_SHA}" GITHUB_REF="${GITHUB_REF}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" PATH="${PATH}" \
            PINOVA_FPM_FULL_STACK_ROOT="${PINOVA_FPM_FULL_STACK_ROOT}" PINOVA_FPM_CAMPAIGN_ROOT="${PINOVA_FPM_CAMPAIGN_ROOT}" \
            PINOVA_FPM_BIN="${PINOVA_FPM_BIN}" PINOVA_FPM_NGINX_BIN="${PINOVA_FPM_NGINX_BIN}" \
            PINOVA_FPM_PHP_BIN="${PINOVA_FPM_PHP_BIN}" PINOVA_FPM_PHP_VERSION="${PINOVA_FPM_PHP_VERSION}" \
            PINOVA_FPM_LOGGING_PROFILE="${PINOVA_FPM_LOGGING_PROFILE}" \
            PINOVA_FPM_ENGINE_COMPARE="${PINOVA_FPM_ENGINE_COMPARE}" PINOVA_FPM_PROBE_CASE="${PINOVA_FPM_PROBE_CASE}" \
            PINOVA_FPM_WP_CLI="${PINOVA_FPM_WP_CLI}" PINOVA_FPM_MYSQL_SOCKET="${PINOVA_FPM_MYSQL_SOCKET}" \
            PINOVA_FPM_MYSQL_DEFAULTS_FILE="${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" \
            node tests/Integration/otp-fpm-revision-campaign.mjs
      - name: Retain every bounded sanitized arm and acceptance result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-comparison-php-${{ matrix.php }}-${{ matrix.logging }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PINOVA_FPM_CAMPAIGN_ROOT }}/receipt
            ${{ env.PINOVA_ENGINE_ROOT }}/receipt
          if-no-files-found: error
          retention-days: 7
