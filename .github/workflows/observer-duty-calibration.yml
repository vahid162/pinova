name: Private observer duty calibration
on:
  push:
    branches: ['proof/observer-duty-calibration-8e005']
permissions:
  contents: read
concurrency:
  group: observer-calibration-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  calibration:
    name: Observer calibration / PHP ${{ matrix.php }} / ${{ matrix.cadence }}ms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        cadence: [40, 200]
    env:
      PINOVA_OBSERVER_CALIBRATION: '1'
      PINOVA_OBSERVER_CADENCE_MS: ${{ matrix.cadence }}
      PINOVA_TEST_PROFILE: third-party
      PINOVA_TEST_PLUGIN_SET: deployed
      PINOVA_FPM_FULL_STACK_ROOT: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}
      PINOVA_FPM_BIN: /usr/sbin/php-fpm${{ matrix.php }}
      PINOVA_FPM_PHP_BIN: /usr/bin/php${{ matrix.php }}
      PINOVA_FPM_PHP_VERSION: ${{ matrix.php }}
      PINOVA_FPM_NGINX_BIN: /usr/sbin/nginx
      PINOVA_FPM_MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      PINOVA_FPM_MYSQL_DEFAULTS_FILE: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}/mysql-admin.cnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3, wp-cli:2.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Validate disposable workflow syntax before provisioning
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Validate native FPM profile evidence before provisioning
        run: |
          node --check tests/Integration/postwork-jit-evidence.mjs
          node --check tests/Integration/otp-fpm-full-stack.mjs
          node --check tests/Integration/otp-fpm-revision-campaign.mjs
          bash -n tests/Integration/otp-fpm-full-stack.sh
          php -l tests/fixtures/fpm-otp/startup-jit-mode.php
          node --test tests/js/postwork-jit-evidence.test.mjs
          node --test tests/js/fixture-http-failures.test.mjs
          node --test tests/js/observer-duty.test.mjs
      - name: Provision disposable native FPM and database
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "php${PINOVA_FPM_PHP_VERSION}-fpm" "php${PINOVA_FPM_PHP_VERSION}-curl" "php${PINOVA_FPM_PHP_VERSION}-gd" "php${PINOVA_FPM_PHP_VERSION}-mbstring" "php${PINOVA_FPM_PHP_VERSION}-mysql" "php${PINOVA_FPM_PHP_VERSION}-xml" "php${PINOVA_FPM_PHP_VERSION}-zip" nginx
          sudo systemctl start mysql.service
          mkdir -p "${PINOVA_FPM_FULL_STACK_ROOT}"
          sudo install -m 0600 /dev/null "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}"
          printf '[client]\nuser=root\npassword=root\n' | sudo tee "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" > /dev/null
          echo "PINOVA_FPM_WP_CLI=$(command -v wp)" >> "${GITHUB_ENV}"
      - name: Prepare verified runtime and plugin profile before network isolation
        run: |
          node --check tests/Integration/otp-fpm-full-stack.mjs
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts
          node tools/prepare-third-party-fixtures.mjs
          wp_version="$(node -p "require('./tests/fixtures/third-party-baseline.json').wordpress")"
          curl --fail --silent --show-error --location --max-time 90 "https://wordpress.org/wordpress-${wp_version}.tar.gz" \
            | tar -xz -C "${PINOVA_FPM_FULL_STACK_ROOT}"
          wp core verify-checksums --path="${PINOVA_FPM_FULL_STACK_ROOT}/wordpress" --version="${wp_version}" --allow-root
      - name: Verify actual queue delivery, capacity, and measured FPM cost
        run: |
          sudo env GITHUB_ACTIONS="${GITHUB_ACTIONS}" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            PINOVA_OBSERVER_CALIBRATION="${PINOVA_OBSERVER_CALIBRATION}" PINOVA_OBSERVER_CADENCE_MS="${PINOVA_OBSERVER_CADENCE_MS}" \
            GITHUB_REF="${GITHUB_REF}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" PATH="${PATH}" \
            PINOVA_FPM_FULL_STACK_ROOT="${PINOVA_FPM_FULL_STACK_ROOT}" \
            PINOVA_FPM_BIN="${PINOVA_FPM_BIN}" PINOVA_FPM_NGINX_BIN="${PINOVA_FPM_NGINX_BIN}" \
            PINOVA_FPM_PHP_BIN="${PINOVA_FPM_PHP_BIN}" PINOVA_FPM_PHP_VERSION="${PINOVA_FPM_PHP_VERSION}" \
            PINOVA_FPM_WP_CLI="${PINOVA_FPM_WP_CLI}" PINOVA_FPM_MYSQL_SOCKET="${PINOVA_FPM_MYSQL_SOCKET}" \
            PINOVA_FPM_MYSQL_DEFAULTS_FILE="${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" \
            bash tests/Integration/otp-fpm-full-stack.sh
      - name: Require the declared native FPM runtime profile
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { validatePostworkProfile } from './tests/Integration/postwork-jit-evidence.mjs';
          let valid = false;
          try {
              const root = process.env.PINOVA_FPM_FULL_STACK_ROOT;
              const bytes = readFileSync(`${root}/receipt/full-stack-result.json`);
              const mode = readFileSync(`${root}/receipt/postwork-jit-mode.json`);
              if (bytes.length > 2 * 1024 * 1024 || mode.length > 8192) throw new Error();
              const receipt = JSON.parse(bytes);
              valid = validatePostworkProfile(JSON.parse(mode), {
                  phpMinor: process.env.PINOVA_FPM_PHP_VERSION,
                  primaryReceiptHash: createHash('sha256').update(bytes).digest('hex'),
                  startupLaunch: receipt.fpm_startup_profile,
              });
          } catch { /* Missing or invalid evidence remains unknown; the primary result is untouched. */ }
          if (!valid) {
              console.error('Native FPM runtime profile is incomplete or mismatched; retain the separate primary workload result.');
              process.exitCode = 1;
          } else console.log('Native FPM runtime profile verified separately from the frozen workload result.');
          JS
      - name: Retain sanitized full-stack acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observer-calibration-${{ matrix.cadence }}ms-php-${{ matrix.php }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PINOVA_FPM_FULL_STACK_ROOT }}/receipt
          if-no-files-found: error
          retention-days: 7
