name: Prepare OTP development lock
on:
  push:
    branches: [fix/otp-worker-delivery]
    paths: [package.json, .github/workflows/prepare-otp-dev-lock.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit reviewable public lock patch
        run: python3 -c 'import json,subprocess; print("PINOVA_LOCK_PATCH " + json.dumps(subprocess.check_output(["git", "diff", "--", "package-lock.json"], text=True)))'
      - run: npm ci --ignore-scripts
      - run: node tools/verify-http-cache-patch.mjs
      - run: npm audit --audit-level=low
