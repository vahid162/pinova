name: Publish pre-release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches:
      - 'publish/v*'

permissions:
  attestations: read
  contents: write

concurrency:
  group: pinova-prerelease-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, fileinfo, gd, json, mbstring, zip
          tools: composer:2.10.3

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#publish/}"
          if [[ "${tag}" == "${RELEASE_BRANCH}" || ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc([1-9][0-9]*)$ ]]; then
            echo "Release branch must match publish/vX.Y.Z-rcN" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          plugin_version="$(php -r "\$s=file_get_contents('pinova.php'); preg_match('/Version:\\s*([0-9.]+)/', \$s, \$m); echo \$m[1] ?? '';")"
          if [[ "${plugin_version}" != "${version}" ]]; then
            echo "Tag version ${version} does not match plugin version ${plugin_version}" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "Release commit ${RELEASE_SHA} is not reachable from main" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build twice and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          zip_path=".build/pinova-${version}.zip"
          first_zip="${RUNNER_TEMP}/pinova-${version}-first.zip"

          umask 0002
          TZ=Pacific/Kiritimati composer build
          cp "${zip_path}" "${first_zip}"
          umask 0022
          TZ=America/Adak composer build
          cmp "${first_zip}" "${zip_path}"
          unzip -tq "${zip_path}"
          if unzip -Z1 "${zip_path}" | awk 'index($0, "pinova/") != 1 { bad = 1 } END { exit bad }'; then
            :
          else
            echo "Every ZIP entry must be under pinova/" >&2
            exit 1
          fi

          (
            cd .build
            sha256sum "pinova-${version}.zip" > "pinova-${version}.zip.sha256"
          )

      - name: Create immutable annotated tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          git fetch --tags origin

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tagged_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tagged_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Existing tag ${tag} points to ${tagged_sha}, not ${RELEASE_SHA}" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${RELEASE_SHA}" -m "Pinova ${tag}"
            git push origin "refs/tags/${tag}"
          fi

      - name: Publish immutable GitHub pre-release and installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          checksum="$(cut -d' ' -f1 ".build/pinova-${version}.zip.sha256")"
          notes="${RUNNER_TEMP}/release-notes.md"

          printf '%s\n' \
            "## Pinova ${version} RC" \
            "" \
            "این نسخه یک پیش‌انتشار برای آزمون staging/canary است و هنوز stable/latest نیست." \
            "" \
            "- Exact commit: \`${RELEASE_SHA}\`" \
            "- Required installation gate: Release API \`immutable: true\` and a successful publisher workflow" \
            "- Publisher identity: \`pinova-prerelease-v2\`" \
            "- Installable asset: \`pinova-${version}.zip\`" \
            "- SHA-256: \`${checksum}\`" \
            "" \
            "این یادداشت به‌تنهایی تأیید انتشار نیست. فقط پس از موفقیت کامل workflow از asset بالا برای staging/canary استفاده کنید؛ فایل خودکار Source code بستهٔ نصب افزونه نیست." \
            > "${notes}"

          release_exists=false
          release_found=false
          if release_state="$(gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isImmutable \
            --jq '[.isDraft, .isImmutable] | @tsv' 2>/dev/null)"; then
            release_found=true
            IFS=$'\t' read -r is_draft is_immutable <<< "${release_state}"
            if [[ "${is_draft}" == "true" ]]; then
              expected_name="Pinova ${tag}"
              actual_name="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')"
              actual_author="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json author --jq '.author.login')"
              actual_target="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq '.targetCommitish')"
              actual_body="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')"
              expected_body="$(cat "${notes}")"
              asset_names="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"

              if [[ "${actual_author}" != "github-actions[bot]" || \
                    "${actual_name}" != "${expected_name}" || \
                    "${actual_target}" != "${RELEASE_SHA}" || \
                    "${actual_body}" != "${expected_body}" ]]; then
                echo "Existing draft ${tag} does not match this publisher identity; refusing to alter it." >&2
                exit 1
              fi
              while IFS= read -r asset_name; do
                if [[ -n "${asset_name}" && \
                      "${asset_name}" != "pinova-${version}.zip" && \
                      "${asset_name}" != "pinova-${version}.zip.sha256" ]]; then
                  echo "Existing draft ${tag} contains unexpected asset ${asset_name}; refusing to alter it." >&2
                  exit 1
                fi
              done <<< "${asset_names}"
              echo "Resuming verified unpublished draft for ${tag}."
            elif [[ "${is_immutable}" == "true" ]]; then
              echo "Immutable Release ${tag} already exists; preserving it and verifying without mutation."
              release_exists=true
            else
              echo "Published Release ${tag} exists but is mutable; refusing to alter it." >&2
              exit 1
            fi
          fi

          if [[ "${release_exists}" != "true" ]]; then
            if [[ "${release_found}" != "true" ]]; then
              gh release create "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${RELEASE_SHA}" \
                --title "Pinova ${tag}" \
                --notes-file "${notes}" \
                --prerelease \
                --draft \
                --verify-tag
            fi
            gh release upload "${tag}" \
              ".build/pinova-${version}.zip#Pinova ${version} installable ZIP" \
              ".build/pinova-${version}.zip.sha256#SHA-256 checksum" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          release_api="repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          release_state="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "${release_api}" \
            --jq '[.draft, .prerelease, .target_commitish, .immutable] | @tsv')"
          IFS=$'\t' read -r is_draft is_prerelease actual_target is_immutable <<< "${release_state}"
          if [[ "${is_draft}" != "false" || \
                "${is_prerelease}" != "true" || \
                "${actual_target}" != "${RELEASE_SHA}" || \
                "${is_immutable}" != "true" ]]; then
            echo "Release ${tag} is not the expected immutable pre-release for ${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Redownload and verify published assets and attestations
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          verify_dir="${RUNNER_TEMP}/published-release"
          mkdir -p "${verify_dir}"

          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "pinova-${version}.zip*" \
            --dir "${verify_dir}"
          (
            cd "${verify_dir}"
            sha256sum -c "pinova-${version}.zip.sha256"
            unzip -tq "pinova-${version}.zip"
            unzip -Z1 "pinova-${version}.zip" | awk 'index($0, "pinova/") != 1 { bad = 1 } END { exit bad }'
          )
          cmp ".build/pinova-${version}.zip" "${verify_dir}/pinova-${version}.zip"
          cmp ".build/pinova-${version}.zip.sha256" "${verify_dir}/pinova-${version}.zip.sha256"

          verified=false
          for _ in 1 2 3 4 5; do
            if gh release verify "${tag}" --repo "${GITHUB_REPOSITORY}" && \
               gh release verify-asset "${tag}" "${verify_dir}/pinova-${version}.zip" --repo "${GITHUB_REPOSITORY}" && \
               gh release verify-asset "${tag}" "${verify_dir}/pinova-${version}.zip.sha256" --repo "${GITHUB_REPOSITORY}"; then
              verified=true
              break
            fi
            sleep 3
          done
          if [[ "${verified}" != "true" ]]; then
            echo "GitHub release attestation verification failed for ${tag}" >&2
            exit 1
          fi
