name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify synchronized release history
        run: php tools/check-changelog-sync.php
      - name: Validate plugin metadata and WordPress readme
        run: php tools/check-plugin-metadata.php
      - name: Verify AI and durable-document governance
        run: php tools/check-ai-governance.php
      - name: Verify release package content policy
        run: bash tests/check-package-content.sh
      - name: Verify release SBOM inventory policy
        run: bash tests/check-sbom-content.sh
      - name: Require Pinova skill synchronization
        env:
          PINOVA_SKILL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .agents/skills/pinova-development/scripts/check-skill-sync.sh "${PINOVA_SKILL_BASE}"

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm run lint:js
      - run: npm run test:js
      - name: Verify bounded log-observation behavior
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ops -p 'test_*.py' -v

  native-events:
    name: Native MariaDB event allocation witness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
        env:
          MARIADB_ROOT_PASSWORD: fixture-only
          MARIADB_DATABASE: pinova_witness_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PINOVA_NATIVE_DB_HOST: 127.0.0.1
      PINOVA_NATIVE_DB_PORT: '3307'
      PINOVA_NATIVE_DB_NAME: pinova_witness_${{ github.run_id }}_${{ github.run_attempt }}
      PINOVA_NATIVE_DB_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
      - name: Verify native allocation, transactions and finite projection
        if: ${{ !cancelled() }}
        run: php tests/ops/mariadb_event_snapshot.php
      - name: Retain bounded nonpersonal native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-event-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinova-native-event-witness-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7

  repository-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Lint shell scripts
        run: git ls-files -z -- '*.sh' | xargs -0 -r shellcheck

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate Composer manifests and lockfile
        run: composer validate --strict --check-lock
      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev
      - name: Install production dependencies from composer.lock
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Verify installed production tree and licenses
        run: php tools/check-production-dependencies.php
      - name: Generate production license inventory
        run: composer licenses --no-dev --format=json > "${RUNNER_TEMP}/composer-production-licenses.json"
      - name: Upload production license inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-production-licenses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composer-production-licenses.json
          if-no-files-found: error
          retention-days: 7
      - name: Recreate npm dependencies from package-lock.json
        run: npm ci --ignore-scripts
      - name: Verify the installed development cache security patch
        run: node tools/verify-http-cache-patch.mjs
      - name: Verify development Git security and YAML compatibility
        run: node tools/verify-dev-dependencies.mjs
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=low

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pinova-plugin-check-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_HOME: /tmp/pinova-plugin-check-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8892'
      WP_ENV_TESTS_PORT: '8893'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.1.0'
      - run: npm run env:start -- --update
      - name: Install PDO MySQL for Plugin Check
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Run WordPress Plugin Check
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin check pinova --mode=update --format=table --require=./wp-content/plugins/plugin-check/cli.php
      - name: Stop disposable Plugin Check environment
        if: always()
        run: npm run env:stop

  browser-account-ui:
    name: Account UI / Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://localhost:8890
      # The runner context is unavailable in job-level env expressions.
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.1.0'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run env:start -- --update
      - name: Install PDO MySQL in the disposable browser containers
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Prepare the real Pinova login route
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp rewrite flush --hard
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused "${PLAYWRIGHT_BASE_URL}/login" --output /dev/null
      - name: Verify real REST-to-Cron delivery boundary
        run: bash tests/Integration/cron-rest-boundary.sh
      - name: Run Chromium and WebKit acceptance
        run: npm run test:browser
      - name: Verify modal tests detect real product faults
        timeout-minutes: 8
        run: node tools/check-modal-test-sensitivity.mjs
      - name: Destroy and verify the disposable browser environment
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          bash tools/cleanup-browser-env.sh 2>&1 | tee test-results/browser-cleanup.log
      - name: Upload browser acceptance and sensitivity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-ui-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/browser
            test-results/browser
            test-results/modal-sensitivity
            test-results/browser-cleanup.log
          if-no-files-found: ignore
          retention-days: 7

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      - run: composer phpstan
      - if: always() && matrix.php == '8.1'
        run: composer phpcs
      - if: matrix.php == '8.1'
        run: composer audit
      - if: matrix.php == '8.1'
        run: composer build
      - name: Generate the built-package SBOM
        if: matrix.php == '8.1'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SELECT_CATALOGERS: '+php-composer-installed-cataloger'
        with:
          path: .build/pinova
          format: spdx-json
          output-file: .build/pinova-ci.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - name: Compare the built ZIP with its SBOM
        if: matrix.php == '8.1'
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(find .build -maxdepth 1 -type f -name 'pinova-*.zip' -print -quit)"
          test -n "${zip_path}"
          bash tools/check-sbom-content.sh "${zip_path}" .build/pinova-ci.spdx.json

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.8'
            wc: '10.7.0'
            php: '8.1'
            hpos: 'yes'
          - wp: '6.8'
            wc: '10.7.0'
            php: '8.1'
            hpos: 'no'
          - wp: 'latest'
            wc: '10.9.4'
            php: '8.1'
            hpos: 'yes'
          - wp: 'latest'
            wc: '10.9.4'
            php: '8.1'
            hpos: 'no'
          - wp: 'latest'
            wc: 'latest'
            php: '8.1'
            hpos: 'yes'
          - wp: 'latest'
            wc: 'latest'
            php: '8.1'
            hpos: 'no'
          - wp: 'latest'
            wc: 'latest'
            php: '8.5'
            hpos: 'yes'
          - wp: 'latest'
            wc: 'latest'
            php: '8.5'
            hpos: 'no'
          - wp: '7.1'
            wc: '11.1.0'
            php: '8.1'
            hpos: 'yes'
          - wp: '7.1'
            wc: '11.1.0'
            php: '8.1'
            hpos: 'no'
          - wp: '7.1'
            wc: '11.2.1'
            php: '8.1'
            hpos: 'yes'
          - wp: '7.1'
            wc: '11.2.1'
            php: '8.1'
            hpos: 'no'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
          PINOVA_TEST_PHP: ${{ matrix.php }}
      - run: npm run env:start -- --update
      - name: Verify the integration container PHP version
        env:
          EXPECTED_PHP: ${{ matrix.php }}
        run: |
          npx wp-env run tests-cli env EXPECTED_PHP="$EXPECTED_PHP" php -r 'printf("PHP %s\n", PHP_VERSION); exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED_PHP") ? 0 : 1);'
      - name: Install PDO MySQL in the disposable test container
        run: npx wp-env run tests-cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - run: npm run test:integration
        env:
          PINOVA_TEST_HPOS: ${{ matrix.hpos }}
      - name: Remove only this job's disposable integration environment
        if: always()
        run: bash tools/cleanup-browser-env.sh

  third-party-baseline:
    name: Real wpForo and Dokan / ${{ matrix.plugins }} / HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hpos: ['yes', 'no']
        plugins: ['baseline', 'current', 'current-wpforo', 'current-dokan', 'deployed']
    env:
      PINOVA_TEST_PROFILE: third-party
      PINOVA_TEST_PLUGIN_SET: ${{ matrix.plugins }}
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - name: Verify exact upstream archives before wp-env can load them
        run: node tools/prepare-third-party-fixtures.mjs
      - run: npm run env:configure
      - run: npm run env:start -- --update
      - name: Install PDO MySQL in the disposable plugin containers
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Select real-plugin order storage
        env:
          HPOS_MODE: ${{ matrix.hpos }}
        run: npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled "$HPOS_MODE"
      - name: Characterize real activated plugin lifecycle
        run: bash tools/run-third-party-baseline.sh
      - name: Prepare real-plugin browser routes
        run: |
          npx playwright install --with-deps chromium
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp rewrite flush --hard
      - name: Verify real mobile proof in the browser
        run: npx playwright test --config tests/browser/integrations.config.mjs
      - name: Upload real-plugin browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-browser-${{ matrix.plugins }}-hpos-${{ matrix.hpos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/browser
            test-results/browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this job's disposable environment
        if: always()
        run: bash tools/cleanup-browser-env.sh

  otp-fpm-boundary:
    name: OTP PHP-FPM response boundary (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      PINOVA_FPM_WORDPRESS_DIR: /tmp/pinova-fpm-${{ github.run_id }}-${{ github.run_attempt }}/wordpress
      PINOVA_FPM_WORK_DIR: /tmp/pinova-fpm-${{ github.run_id }}-${{ github.run_attempt }}/receipt
      PINOVA_FPM_BIN: /usr/sbin/php-fpm${{ matrix.php }}
      PINOVA_FPM_NGINX_BIN: /usr/sbin/nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Provision isolated FPM characterization tools
        env:
          FPM_PHP_VERSION: ${{ matrix.php }}
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "php${FPM_PHP_VERSION}-fpm" nginx
          mkdir -p "$(dirname "${PINOVA_FPM_WORDPRESS_DIR}")"
          curl --fail --silent --show-error --location --max-time 90 https://wordpress.org/wordpress-6.8.tar.gz \
            | tar -xz -C "$(dirname "${PINOVA_FPM_WORDPRESS_DIR}")"
      - name: Characterize real REST output and post-response FPM work
        run: bash tests/Integration/otp-fpm-response-boundary.sh
      - name: Retain bounded characterization receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otp-fpm-boundary-php-${{ matrix.php }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PINOVA_FPM_WORK_DIR }}/artifacts
          if-no-files-found: error
          retention-days: 7

  otp-fpm-full-stack:
    name: OTP PHP-FPM queue and resources (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      PINOVA_TEST_PROFILE: third-party
      PINOVA_TEST_PLUGIN_SET: deployed
      PINOVA_FPM_FULL_STACK_ROOT: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}
      PINOVA_FPM_BIN: /usr/sbin/php-fpm${{ matrix.php }}
      PINOVA_FPM_PHP_BIN: /usr/bin/php${{ matrix.php }}
      PINOVA_FPM_PHP_VERSION: ${{ matrix.php }}
      PINOVA_FPM_NGINX_BIN: /usr/sbin/nginx
      PINOVA_FPM_MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      PINOVA_FPM_MYSQL_DEFAULTS_FILE: /tmp/pinova-fpm-full-${{ github.run_id }}-${{ github.run_attempt }}/mysql-admin.cnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3, wp-cli:2.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Provision disposable native FPM and database
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "php${PINOVA_FPM_PHP_VERSION}-fpm" "php${PINOVA_FPM_PHP_VERSION}-curl" "php${PINOVA_FPM_PHP_VERSION}-gd" "php${PINOVA_FPM_PHP_VERSION}-mbstring" "php${PINOVA_FPM_PHP_VERSION}-mysql" "php${PINOVA_FPM_PHP_VERSION}-xml" "php${PINOVA_FPM_PHP_VERSION}-zip" nginx
          sudo systemctl start mysql.service
          mkdir -p "${PINOVA_FPM_FULL_STACK_ROOT}"
          sudo install -m 0600 /dev/null "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}"
          printf '[client]\nuser=root\npassword=root\n' | sudo tee "${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" > /dev/null
          echo "PINOVA_FPM_WP_CLI=$(command -v wp)" >> "${GITHUB_ENV}"
      - name: Prepare verified runtime and plugin profile before network isolation
        run: |
          node --check tests/Integration/otp-fpm-full-stack.mjs
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts
          node tools/prepare-third-party-fixtures.mjs
          wp_version="$(node -p "require('./tests/fixtures/third-party-baseline.json').wordpress")"
          curl --fail --silent --show-error --location --max-time 90 "https://wordpress.org/wordpress-${wp_version}.tar.gz" \
            | tar -xz -C "${PINOVA_FPM_FULL_STACK_ROOT}"
          wp core verify-checksums --path="${PINOVA_FPM_FULL_STACK_ROOT}/wordpress" --version="${wp_version}" --allow-root
      - name: Verify actual queue delivery, capacity, and measured FPM cost
        run: |
          sudo env GITHUB_ACTIONS="${GITHUB_ACTIONS}" RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" PATH="${PATH}" \
            PINOVA_FPM_FULL_STACK_ROOT="${PINOVA_FPM_FULL_STACK_ROOT}" \
            PINOVA_FPM_BIN="${PINOVA_FPM_BIN}" PINOVA_FPM_NGINX_BIN="${PINOVA_FPM_NGINX_BIN}" \
            PINOVA_FPM_PHP_BIN="${PINOVA_FPM_PHP_BIN}" PINOVA_FPM_PHP_VERSION="${PINOVA_FPM_PHP_VERSION}" \
            PINOVA_FPM_WP_CLI="${PINOVA_FPM_WP_CLI}" PINOVA_FPM_MYSQL_SOCKET="${PINOVA_FPM_MYSQL_SOCKET}" \
            PINOVA_FPM_MYSQL_DEFAULTS_FILE="${PINOVA_FPM_MYSQL_DEFAULTS_FILE}" \
            bash tests/Integration/otp-fpm-full-stack.sh
      - name: Retain sanitized full-stack acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otp-fpm-full-stack-php-${{ matrix.php }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PINOVA_FPM_FULL_STACK_ROOT }}/receipt
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs:
      - project-guidance
      - javascript
      - native-events
      - repository-lint
      - dependency-review
      - supply-chain
      - plugin-check
      - browser-account-ui
      - php
      - integration
      - third-party-baseline
      - otp-fpm-boundary
      - otp-fpm-full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          PROJECT_GUIDANCE: ${{ needs.project-guidance.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          NATIVE_EVENTS: ${{ needs.native-events.result }}
          REPOSITORY_LINT: ${{ needs.repository-lint.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          PLUGIN_CHECK: ${{ needs.plugin-check.result }}
          BROWSER: ${{ needs.browser-account-ui.result }}
          PHP: ${{ needs.php.result }}
          INTEGRATION: ${{ needs.integration.result }}
          THIRD_PARTY_BASELINE: ${{ needs.third-party-baseline.result }}
          OTP_FPM_BOUNDARY: ${{ needs.otp-fpm-boundary.result }}
          OTP_FPM_FULL_STACK: ${{ needs.otp-fpm-full-stack.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "${PROJECT_GUIDANCE}" = success
          test "${JAVASCRIPT}" = success
          test "${NATIVE_EVENTS}" = success
          test "${REPOSITORY_LINT}" = success
          test "${SUPPLY_CHAIN}" = success
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${DEPENDENCY_REVIEW}" = success
          else
            test "${DEPENDENCY_REVIEW}" = skipped
          fi
          test "${PLUGIN_CHECK}" = success
          test "${BROWSER}" = success
          test "${PHP}" = success
          test "${INTEGRATION}" = success
          test "${THIRD_PARTY_BASELINE}" = success
          test "${OTP_FPM_BOUNDARY}" = success
          test "${OTP_FPM_FULL_STACK}" = success
