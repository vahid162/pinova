name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify synchronized release history
        run: php tools/check-changelog-sync.php
      - name: Validate plugin metadata and WordPress readme
        run: php tools/check-plugin-metadata.php
      - name: Verify AI and durable-document governance
        run: php tools/check-ai-governance.php
      - name: Require Pinova skill synchronization
        env:
          PINOVA_SKILL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .agents/skills/pinova-development/scripts/check-skill-sync.sh "${PINOVA_SKILL_BASE}"

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: npm run lint:js
      - run: npm run test:js

  repository-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Lint shell scripts
        run: git ls-files -z -- '*.sh' | xargs -0 -r shellcheck

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate Composer manifests and lockfile
        run: composer validate --strict --check-lock
      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev
      - name: Install production dependencies from composer.lock
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Verify installed production tree and licenses
        run: php tools/check-production-dependencies.php
      - name: Generate production license inventory
        run: composer licenses --no-dev --format=json > "${RUNNER_TEMP}/composer-production-licenses.json"
      - name: Upload production license inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-production-licenses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composer-production-licenses.json
          if-no-files-found: error
          retention-days: 7
      - name: Recreate npm dependencies from package-lock.json
        run: npm ci --ignore-scripts
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=low

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pinova-plugin-check-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_HOME: /tmp/pinova-plugin-check-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8892'
      WP_ENV_TESTS_PORT: '8893'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.1.0'
      - run: npm run env:start -- --update
      - name: Install PDO MySQL for Plugin Check
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Run WordPress Plugin Check
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin check pinova --mode=update --format=table --require=./wp-content/plugins/plugin-check/cli.php
      - name: Stop disposable Plugin Check environment
        if: always()
        run: npm run env:stop

  browser-account-ui:
    name: Account UI / Stage 1 Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://localhost:8890
      # The runner context is unavailable in job-level env expressions.
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.1.0'
      - run: npx playwright install --with-deps chromium
      - run: npm run env:start -- --update
      - name: Install PDO MySQL in the disposable browser containers
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Prepare the real Pinova login route
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp rewrite flush --hard
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused "${PLAYWRIGHT_BASE_URL}/login" --output /dev/null
      - name: Run Stage 1 browser acceptance
        run: npm run test:browser
      - name: Verify modal tests detect real product faults
        timeout-minutes: 8
        run: node tools/check-modal-test-sensitivity.mjs
      - name: Destroy and verify the disposable browser environment
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          bash tools/cleanup-browser-env.sh 2>&1 | tee test-results/browser-cleanup.log
      - name: Upload browser acceptance and sensitivity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-ui-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/browser
            test-results/browser
            test-results/modal-sensitivity
            test-results/browser-cleanup.log
          if-no-files-found: ignore
          retention-days: 7

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      - run: composer phpstan
      - if: matrix.php == '8.1'
        run: composer phpcs
      - if: matrix.php == '8.1'
        run: composer audit
      - if: matrix.php == '8.1'
        run: composer build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.8'
            wc: '10.7.0'
            hpos: 'yes'
          - wp: '6.8'
            wc: '10.7.0'
            hpos: 'no'
          - wp: 'latest'
            wc: '10.9.4'
            hpos: 'yes'
          - wp: 'latest'
            wc: '10.9.4'
            hpos: 'no'
          - wp: 'latest'
            wc: 'latest'
            hpos: 'yes'
          - wp: 'latest'
            wc: 'latest'
            hpos: 'no'
          - wp: '7.1'
            wc: '11.1.0'
            hpos: 'yes'
          - wp: '7.1'
            wc: '11.1.0'
            hpos: 'no'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
      - run: npm run env:start -- --update
      - name: Install PDO MySQL in the disposable test container
        run: npx wp-env run tests-cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - run: npm run test:integration
        env:
          PINOVA_TEST_HPOS: ${{ matrix.hpos }}

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs:
      - project-guidance
      - javascript
      - repository-lint
      - dependency-review
      - supply-chain
      - plugin-check
      - browser-account-ui
      - php
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          PROJECT_GUIDANCE: ${{ needs.project-guidance.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          REPOSITORY_LINT: ${{ needs.repository-lint.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          PLUGIN_CHECK: ${{ needs.plugin-check.result }}
          BROWSER: ${{ needs.browser-account-ui.result }}
          PHP: ${{ needs.php.result }}
          INTEGRATION: ${{ needs.integration.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "${PROJECT_GUIDANCE}" = success
          test "${JAVASCRIPT}" = success
          test "${REPOSITORY_LINT}" = success
          test "${SUPPLY_CHAIN}" = success
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${DEPENDENCY_REVIEW}" = success
          else
            test "${DEPENDENCY_REVIEW}" = skipped
          fi
          test "${PLUGIN_CHECK}" = success
          test "${BROWSER}" = success
          test "${PHP}" = success
          test "${INTEGRATION}" = success
