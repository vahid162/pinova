name: Final review regression proof

on:
  push:
    branches: ['proof/diagnostics-review-regressions-*', 'verify/diagnostics-u6-final-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-review-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-lease-and-transport-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.2.1'
          PINOVA_TEST_PHP: '8.3'
      - run: npm run env:start -- --update
      - name: Verify proof container PHP
        run: |
          npx wp-env run tests-cli php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === "8.3" ? 0 : 1);'
      - name: Install PDO MySQL only in the disposable proof container
        run: npx wp-env run tests-cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Exercise native fast-slot acquisition and HTTP outcome facts
        run: |
          plugin_directory="$(basename "$GITHUB_WORKSPACE")"
          npx wp-env run tests-cli --env-cwd="wp-content/plugins/$plugin_directory" env PINOVA_TEST_HPOS=no vendor/bin/phpunit -c phpunit.integration.xml.dist --filter 'OTPDiagnosticsIntegrationTest|IssueMonitorIntegrationTest'
      - name: Remove only this proof job's disposable environment
        if: always()
        run: bash tools/cleanup-browser-env.sh

  transport-projection-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Exercise HTTP completion projection
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist --filter IssueMonitorTest

  sidebar-lifecycle-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Exercise actual form sidebar close and owned teardown
        run: node --test tests/js/auth-webotp-lifecycle.test.mjs
      - name: Prove sidebar regressions detect each omitted lifecycle safeguard
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const target = 'assets/js/pages/login-form.js';
          const original = readFileSync(target, 'utf8');
          const faults = [
            ["target.on('wdCloseSide.pinovaAuth', close);", '/* isolated proof fault: subscription omitted */', 'native sidebar close must abort'],
            ["this.themeWebOtpCleanup = () => target.off('wdCloseSide.pinovaAuth', close);", 'this.themeWebOtpCleanup = () => {};', 'destroy must preserve the other mount'],
            ["this.themeWebOtpCleanup = () => target.off('wdCloseSide.pinovaAuth', close);", "this.themeWebOtpCleanup = () => target.off('wdCloseSide.pinovaAuth');", 'destroy must preserve the other mount'],
          ];
          for (let index = 0; index < faults.length; index++) {
            const [needle, replacement, expected] = faults[index];
            assert.equal(original.split(needle).length, 2, 'source mutation must match exactly once');
            let result;
            try {
              writeFileSync(target, original.replace(needle, replacement));
              result = spawnSync(process.execPath, ['--test', '--test-name-pattern=^sidebar:', 'tests/js/auth-webotp-lifecycle.test.mjs'], {encoding: 'utf8', maxBuffer: 1024 * 1024, timeout: 30000});
            } finally { writeFileSync(target, original); }
            assert.equal(result.error, undefined, 'fault execution must complete');
            assert.notEqual(result.status, 0, 'omitted lifecycle safety must be detected');
            assert.equal(result.signal, null, 'signal termination is not an assertion witness');
            assert.match(result.stdout, /AssertionError/);
            assert.ok(result.stdout.includes(expected), 'the intended lifecycle assertion must fail');
            console.log(`Sidebar fault ${index + 1}: intended assertion detected; source restored.`);
          }
          assert.equal(readFileSync(target, 'utf8'), original);
          JS
