name: U5 theme browser verification

on:
  push:
    branches: ['verify/diagnostics-u5-ui']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u5-theme-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-browser:
    name: Actual adapters / Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://localhost:8890
      WP_ENV_HOME: /tmp/pinova-browser-${{ github.run_id }}-${{ github.run_attempt }}
      WP_ENV_PORT: '8890'
      WP_ENV_TESTS_PORT: '8891'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:2.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run env:configure
        env:
          WP_VERSION: '7.1'
          WC_VERSION: '11.1.0'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run env:start -- --update
      - name: Install PDO MySQL only in disposable browser containers
        run: |
          npx wp-env run wordpress sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
          npx wp-env run wordpress sudo apache2ctl -k graceful
          npx wp-env run cli sudo env PHP_INI_DIR=/usr/local/etc/php docker-php-ext-install pdo_mysql
      - name: Prepare the exact loopback REST origin
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp rewrite flush --hard
      - name: Run actual theme adapters with both browser engines
        run: npx playwright test --config tests/browser/theme-proof.config.mjs
      - name: Remove only this job's disposable browser environment
        if: always()
        run: bash tools/cleanup-browser-env.sh
      - name: Upload bounded browser verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: u5-theme-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/browser
            test-results/browser
          if-no-files-found: ignore
          retention-days: 7
