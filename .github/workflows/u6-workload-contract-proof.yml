name: Revision workload contract proof

on:
  push:
    branches: ['proof/diagnostics-u6-runner-order']

permissions:
  contents: read

jobs:
  workload-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Complete declared runner opportunities before requiring acceptance
        run: node --test tests/js/otp-fpm-revision-workload.test.mjs
